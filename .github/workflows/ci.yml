  ksword-x96dbg:
    name: TitanEngine and x96dbg Release build (x64)
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.x96dbg == 'true' && needs.source-integrity.result == 'success'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Only native Titan is needed for the forwarding regression. No Qt or
      # debugger GUI payload is built or launched in this job.
      - name: Check out pinned native TitanEngine
        uses: actions/checkout@v5
        with:
          repository: x64dbg/TitanEngine
          ref: 21ef77f31fd42d17f785802c36b2ca4ca44c43d7
          path: .deps/ci-titanengine
          persist-credentials: false

      - name: Build the x64 proxy, launcher and backend contract tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path -LiteralPath $msbuild)) {
            throw 'Could not locate 64-bit MSBuild through vswhere.'
          }
          $properties = @(
            '/t:Build', '/p:Configuration=Release', '/p:Platform=x64',
            '/p:PreferredToolArchitecture=x64',
            '/p:PROCESSOR_ARCHITECTURE=AMD64',
            '/p:PROCESSOR_ARCHITEW6432=AMD64', '/m:1', '/v:minimal'
          )
          foreach ($project in @(
            'TitanEnginePlugin/KswordTitanEngine.vcxproj',
            'TitanEnginePlugin/tests/LifetimeTests.vcxproj',
            'X96dbgExecutablePlugin/KswordX96dbgLauncher.vcxproj',
            'DebuggerBackend/tests/BackendTests.vcxproj'
          )) {
            $toolPropertiesJson = & $msbuild $project /p:Configuration=Release /p:Platform=x64 `
              /p:PreferredToolArchitecture=x64 /p:PROCESSOR_ARCHITECTURE=AMD64 /p:PROCESSOR_ARCHITEW6432=AMD64 `
              '-getProperty:PreferredToolArchitecture,VC_ExecutablePath_x64' /nologo
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect MSVC host tools for $project." }
            $toolProperties = ($toolPropertiesJson -join "`n" | ConvertFrom-Json).Properties
            if ($toolProperties.PreferredToolArchitecture -ne 'x64' -or $toolProperties.VC_ExecutablePath_x64 -notmatch 'HostX64[\\/]x64' -or
                $toolProperties.VC_ExecutablePath_x64 -match 'HostX86') { throw "Refusing non-HostX64 tools for $project." }
            Write-Output "BUILD_HOST_TOOLS $project=$($toolProperties.VC_ExecutablePath_x64)"
            & $msbuild $project @properties
            if ($LASTEXITCODE -ne 0) { throw "MSBuild failed for $project with exit code $LASTEXITCODE." }
          }

      - name: Build pinned native TitanEngine with HostX64
        shell: pwsh
        run: |
          $baseline = Get-Content -Raw -LiteralPath 'X96dbgIntegration/PINNED_BASELINES.json' | ConvertFrom-Json
          $actual = (& git -C '.deps/ci-titanengine' rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $baseline.nativeTitanEngine) { throw 'Native TitanEngine source revision does not match the audited baseline.' }
          # CMake compiler probes run before the generated project is built.
          # MSVC's local-property rules can otherwise select HostX86 even when
          # -T host=x64 was requested, so constrain the probe process as well.
          $env:PROCESSOR_ARCHITECTURE = 'AMD64'
          $env:PROCESSOR_ARCHITEW6432 = 'AMD64'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path -LiteralPath $msbuild)) { throw 'Could not locate 64-bit MSBuild for CMake probes.' }
          cmake -S '.deps/ci-titanengine' -B '.deps/ci-titanengine/build-x64' `
            -G 'Visual Studio 17 2022' -A x64 -T host=x64 `
            "-DCMAKE_MAKE_PROGRAM=$msbuild" -DCMKR_SKIP_GENERATION=ON -DTITANENGINE_RESOURCES=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native TitanEngine x64 configuration failed.' }
          $nativeProject = '.deps/ci-titanengine/build-x64/TitanEngine.vcxproj'
          $toolPropertiesJson = & $msbuild $nativeProject /p:Configuration=Release /p:Platform=x64 `
            /p:PreferredToolArchitecture=x64 /p:PROCESSOR_ARCHITECTURE=AMD64 /p:PROCESSOR_ARCHITEW6432=AMD64 `
            '-getProperty:PreferredToolArchitecture,VC_ExecutablePath_x64' /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect native TitanEngine MSVC host tools.' }
          $toolProperties = ($toolPropertiesJson -join "`n" | ConvertFrom-Json).Properties
          if ($toolProperties.PreferredToolArchitecture -ne 'x64' -or $toolProperties.VC_ExecutablePath_x64 -notmatch 'HostX64[\\/]x64' -or
              $toolProperties.VC_ExecutablePath_x64 -match 'HostX86') { throw 'Refusing native TitanEngine non-HostX64 tools.' }
          Write-Output "BUILD_HOST_TOOLS $nativeProject=$($toolProperties.VC_ExecutablePath_x64)"
          cmake --build '.deps/ci-titanengine/build-x64' --config Release --target TitanEngine -- `
            /p:PreferredToolArchitecture=x64 /p:PROCESSOR_ARCHITECTURE=AMD64 /p:PROCESSOR_ARCHITEW6432=AMD64 /m:1
          if ($LASTEXITCODE -ne 0) { throw 'Native TitanEngine x64 build failed.' }

      - name: Validate all 64 canonical signatures and exports
        shell: pwsh
        run: |
          python 'third_party/x64dbg_abi/check_titanengine_exports.py' `
            'TitanEnginePlugin/x64/Release/TitanEngine.dll' `
            '.deps/ci-titanengine/build-x64/Release/TitanEngine.dll' `
            --definition 'third_party/x64dbg_abi/TitanEngine.def' `
            --canonical-header 'third_party/x64dbg_abi/TitanEngine.h' `
            --adapter-header '.deps/ci-titanengine/TitanEngine/definitions.h'
          if ($LASTEXITCODE -ne 0) { throw 'Canonical TitanEngine ABI validation failed.' }

      - name: Run production native forwarding and backend contract tests
        shell: pwsh
        run: |
          # These tests use self-process memory and modeled driver calls. They
          # do not create a debugger GUI, load a driver or start resident HVM.
          python 'TitanEnginePlugin/tests/validate_proxy.py' `
            --proxy 'TitanEnginePlugin/x64/Release/TitanEngine.dll' `
            --native '.deps/ci-titanengine/build-x64/Release/TitanEngine.dll' `
            --fixture-root '.codex-build-logs/x96dbg-native-fixtures'
          if ($LASTEXITCODE -ne 0) { throw 'Production native forwarding tests failed.' }
          & '.codex-build-logs/debugger-tests/BackendTests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Debugger backend contract tests failed.' }
          & 'TitanEnginePlugin/tests/x64/Release/LifetimeTests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'EPT memory/module lifetime contract tests failed.' }
          & 'X96dbgExecutablePlugin/tests/LauncherTests.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'x96dbg launcher protocol/PE tests failed.' }

      - name: Verify x96dbg build artifacts
        shell: pwsh
        run: |
          foreach ($artifact in @(
            'TitanEnginePlugin/x64/Release/TitanEngine.dll',
            'TitanEnginePlugin/x64/Release/TitanEngine.pdb',
            'X96dbgExecutablePlugin/x64/Release/KswordX96dbgLauncher.exe',
            'X96dbgExecutablePlugin/x64/Release/KswordX96dbgLauncher.pdb'
          )) {
            if (-not (Test-Path -LiteralPath $artifact) -or (Get-Item -LiteralPath $artifact).Length -eq 0) { throw "Expected nonempty x96dbg artifact is missing: $artifact" }
          }

      # Add a separate component artifact. The existing automatic prerelease
      # asset selection and aggregate Release layout remain compatible.
      - name: Upload TitanEngine and x96dbg artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordX96dbg-x64-Release
          path: |
            TitanEnginePlugin/x64/Release/TitanEngine.dll
            TitanEnginePlugin/x64/Release/TitanEngine.pdb
            X96dbgExecutablePlugin/x64/Release/KswordX96dbgLauncher.exe
            X96dbgExecutablePlugin/x64/Release/KswordX96dbgLauncher.pdb
          if-no-files-found: error

  auto-prerelease:
    name: Publish automatic prerelease
    needs:
      - changes
      - source-integrity
      - usermode-release
      - ksword-setup
      - ksword-arklight
      - ksword-ce-plugin
      - ksword-ce-launcher
      - ksword-x96dbg
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release automation
        uses: actions/checkout@v5

      - name: Publish prerelease and retain the latest three
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CURRENT_USERMODE_REQUIRED: ${{ needs.changes.outputs.usermode }}
          CURRENT_SETUP_REQUIRED: ${{ needs.changes.outputs.setup }}
          CURRENT_ARKLIGHT_REQUIRED: ${{ needs.changes.outputs.arklight }}
          CURRENT_CE_PLUGIN_REQUIRED: ${{ needs.changes.outputs.ce_plugin }}
          CURRENT_CE_LAUNCHER_REQUIRED: ${{ needs.changes.outputs.ce_launcher }}
        run: |
          # Preserve build failures while still publishing their diagnostics.
          # Packaging/API failures also get a diagnostic release when possible.
          set +e
          bash .github/workflows/scripts/publish-ci-prerelease.sh 2>&1 | tee "$RUNNER_TEMP/ci-release-publish.log"
          publish_status=${PIPESTATUS[0]}
          set -e
          if (( publish_status != 0 )); then
            python3 tools/ci_failure_release.py --publication-error-log "$RUNNER_TEMP/ci-release-publish.log"
            exit "$publish_status"
          fi
