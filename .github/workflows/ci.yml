name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Keep every run: commits and PR updates may build in parallel.

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}
      usermode: ${{ steps.detect.outputs.usermode }}
      setup: ${{ steps.detect.outputs.setup }}
      arklight: ${{ steps.detect.outputs.arklight }}
      ce_plugin: ${{ steps.detect.outputs.ce_plugin }}
      ce_launcher: ${{ steps.detect.outputs.ce_launcher }}
      x96dbg: ${{ steps.detect.outputs.x96dbg }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed project inputs
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          RUN_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          previous_run_id=0
          previous_status='not_checked'
          previous_conclusion='none'
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            if previous_run="$({
              gh api --method GET \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch="$RUN_BRANCH" \
                -f per_page=20 \
                --jq "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID})][0] // {} | [(.id // 0), (.status // \"missing\"), (.conclusion // \"none\")] | @tsv"
            } 2>&1)"; then
              IFS=$'\t' read -r previous_run_id previous_status previous_conclusion <<< "$previous_run"
            else
              echo "Unable to query the previous CI run: $previous_run" >&2
              previous_status='query_failed'
            fi
          fi

          echo "Previous CI run for branch $RUN_BRANCH: id=$previous_run_id status=$previous_status conclusion=$previous_conclusion"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed='__all__'
          elif [[ "$previous_status" != "completed" || "$previous_conclusion" != "success" ]]; then
            echo 'Previous CI run did not complete successfully; treating all projects as affected.' >&2
            changed='__all__'
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF" --depth=1
            base_sha="$(git merge-base "origin/$BASE_REF" "$EVENT_SHA")"
            changed="$(git diff --name-only "$base_sha" "$EVENT_SHA")"
          elif [[ -n "${EVENT_BEFORE:-}" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")"
            else
              echo "Previous push commit $EVENT_BEFORE is unavailable; treating all projects as affected." >&2
              changed='__all__'
            fi
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
          fi

          matches() {
            if [[ "$changed" == '__all__' ]]; then
              return 0
            fi
            printf '%s\n' "$changed" | grep -Eq "$1"
          }

          common='(^tools/|^scripts/|^shared/|^third_party/|^\.deps/|^\.github/workflows/|^.*\.sln$|(^|/)(Directory\.Build\..*|.*\.props|.*\.targets)$)'
          usermode_re="^(TaskmgrHijack\.ps1$|Ksword5\.1/|Launcher/|Taskbar/|KswordHUD/|APIMonitor_x64/|KswordCLI/|KswordFsDecodeTests/|DwmZOrderAgent/)|$common"
          setup_re="^(TaskmgrHijack\.ps1$|KswordSetup/|Ksword5\.1/|Launcher/|Taskbar/|KswordHUD/|APIMonitor_x64/|KswordCLI/|KswordARKDriver/|KswordARKLight/|DwmZOrderAgent/)|$common"
          arklight_re="^(KswordARKLight/|KswordARKLightTests/|KswordARKDriver/|Ksword5\.1/Ksword5\.1/(ArkDriverClient/|Resource/)|shared/driver/|scripts/Sign-KswordArkDriverVariant\.ps1)|$common"
          ce_plugin_re="^(CheatEnginePlugin/|DebuggerBackend/|Ksword5\.1/Ksword5\.1/(ArkDriverClient/|ksword/string/)|shared/driver/)|$common"
          ce_launcher_re="^(CheatEngineExecutablePlugin/|Ksword5\.1/Ksword5\.1/(ArkDriverClient/|ksword/string/))|$common"
          x96dbg_re="^(TitanEnginePlugin/|X96dbgExecutablePlugin/|X96dbgIntegration/|DebuggerBackend/|Ksword5\.1/Ksword5\.1/(ArkDriverClient/|ksword/string/))|$common"

          # 回归保护：主程序构建后直接复制根目录脚本，路径规则必须始终命中。
          for project_rule in "$usermode_re" "$setup_re"; do
            if ! printf '%s\n' 'TaskmgrHijack.ps1' | grep -Eq "$project_rule"; then
              echo 'TaskmgrHijack.ps1 must trigger user-mode and setup builds.' >&2
              exit 1
            fi
          done

          usermode=false
          setup=false
          arklight=false
          ce_plugin=false
          ce_launcher=false
          x96dbg=false
          matches "$usermode_re" && usermode=true || true
          matches "$setup_re" && setup=true || true
          matches "$arklight_re" && arklight=true || true
          matches "$ce_plugin_re" && ce_plugin=true || true
          matches "$ce_launcher_re" && ce_launcher=true || true
          matches "$x96dbg_re" && x96dbg=true || true

          any=false
          [[ "$usermode" == true || "$setup" == true || "$arklight" == true || "$ce_plugin" == true || "$ce_launcher" == true || "$x96dbg" == true ]] && any=true

          {
            echo "any=$any"
            echo "usermode=$usermode"
            echo "setup=$setup"
            echo "arklight=$arklight"
            echo "ce_plugin=$ce_plugin"
            echo "ce_launcher=$ce_launcher"
            echo "x96dbg=$x96dbg"
          } >> "$GITHUB_OUTPUT"

          echo 'Changed paths:'
          printf '%s\n' "$changed"
          echo "Affected projects: usermode=$usermode setup=$setup arklight=$arklight ce_plugin=$ce_plugin ce_launcher=$ce_launcher x96dbg=$x96dbg"

  source-integrity:
    name: Source integrity
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check changed-file whitespace
        shell: pwsh
        run: |
          # 捕获的工具输出不受源码卫生检查约束。
          #
          # docs/next/logs/ 里是 kd !analyze、验收套件、飞行记录仪逐字写下来的
          # 转录。kd 的输出本身就带行尾空格，而这些文件的价值恰恰在于"与工具当时
          # 打出来的一模一样"——为过检查去改它，等于把证据改成了别的东西。
          # Original third-party license texts are retained byte-for-byte, and
          # unified patches require their leading context-space on blank lines.
          # Exclude only these imported texts; C/C++ source stays checked.
          $skipLogs = @(
            ':(exclude)docs/next/logs/**',
            ':(exclude)third_party/x64dbg_abi/LICENSE',
            ':(exclude)third_party/x64dbg_runtime_licenses/**',
            ':(exclude)X96dbgIntegration/patches/*.patch'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD" -- . @skipLogs
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $before = [string]$event.before
            $after = [string]$event.after
            $zeroCommit = '0' * 40

            if ($before -and $before -ne $zeroCommit) {
              git cat-file -e "$before^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) {
                git fetch --no-tags --depth=1 origin $before
                git cat-file -e "$before^{commit}" 2>$null
              }
            }

            if ($before -and $before -ne $zeroCommit -and $LASTEXITCODE -eq 0) {
              git diff --check $before $after -- . @skipLogs
            }
            else {
              $commits = @($event.commits)
              $expectedCommitCount = $commits.Count
              if ($expectedCommitCount -le 0) {
                throw "Cannot prove the complete push range: before=$before and the push payload contains no commits."
              }
              if ($expectedCommitCount -ge 2048) {
                throw "Cannot prove the complete push range because GitHub caps the push payload at 2048 commits."
              }

              $firstCommit = [string]$commits[0].id
              git cat-file -e "$firstCommit^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw "First pushed commit $firstCommit is unavailable."
              }
              $fallbackBase = (git rev-parse "$firstCommit^" 2>$null).Trim()
              if ($LASTEXITCODE -ne 0 -or -not $fallbackBase) {
                throw "Parent of first pushed commit $firstCommit is unavailable."
              }
              git merge-base --is-ancestor $fallbackBase $after
              if ($LASTEXITCODE -ne 0) {
                throw "Push payload is not a complete ancestry range: $fallbackBase..$after."
              }

              $rangeCommitCount = [int](git rev-list --count "$fallbackBase..$after")
              if ($LASTEXITCODE -ne 0 -or $rangeCommitCount -ne $expectedCommitCount) {
                throw "Push payload is incomplete: payload commits=$expectedCommitCount, ancestry commits=$rangeCommitCount."
              }

              Write-Warning "Previous push commit is unavailable; checking all $expectedCommitCount commits from the push payload."
              git diff --check $fallbackBase $after -- . @skipLogs
            }
          }
          else {
            git diff --check HEAD~1 HEAD -- . @skipLogs
          }

      - name: Validate tracked JSON
        shell: pwsh
        run: |
          @'
          import json
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "ls-files", "--", "*.json"], text=True
          ).splitlines()
          for raw_path in paths:
              with open(raw_path, encoding="utf-8-sig") as source:
                  json.load(source)
          print(f"Validated {len(paths)} tracked JSON file(s).")
          '@ | python -

      - name: Audit language packs
        run: >-
          python tools/i18n_language_pack.py audit
          --source-root Ksword5.1/Ksword5.1
          --zh-pack Ksword5.1/Ksword5.1/languages/zh-CN.json
          --en-pack Ksword5.1/Ksword5.1/languages/en-US.json

      - name: Validate kernel knowledge research chain
        run: python tools/validate_kernel_knowledge.py

      - name: Test QADS artifact validation
        run: python tools/test_verify_qads_runtime.py

      - name: Test failed CI release reporting
        run: python tools/test_ci_failure_release.py

      - name: Test unified driver release packaging
        run: python tools/test_ci_driver_package.py

      # 这道门禁原先挂在主程序 vcxproj 的 BeforeTargets="ClCompile" 上，靠"每次
      # 编译 GUI 都会顺带跑一遍"来生效。2026-09-19 主程序对 hvm_ctl 的依赖整条
      # 摘掉，那个目标也一起删了——于是它变成一个谁都不跑的脚本。接到这里来：
      # 纯源码解析，不需要先把探针编出来。
      - name: Gate hvm_ctl command catalog
        run: python tools/hvm_ctl/audit_catalog.py

      # 这两条不变量少一个字就会静默退化成共享层次：翻转路径的 INVEPT 操作数，
      # 以及两个 arm 站点的 Local 参数。改动落在 VM-exit 路径上，没有运行期
      # 验证手段，所以只能在编译机上钉死。门禁本身用两次变异注入验证过能抓到回归。
      - name: Gate per-processor EPT invariants
        run: python tools/hvm_local_ept_gate.py

      # 这批算术在驱动里只有加载后才执行，出错的表现是蓝屏或者更糟——静默改掉
      # 一块无关内存的 EPT 权限。抽进共享头之后正确性可以在编译机上直接证明，
      # 所以它没有理由只靠人手动跑。
      - name: Run HVM control-arithmetic unit tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) {
            throw 'Could not locate the MSVC toolset through vswhere.'
          }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          cmd /c "`"$vcvars`" >nul && cl /nologo /O2 /MT /W4 /WX tools\hvm_unit_tests\hvm_unit_tests.c /Fe:artifacts\hvm_unit_tests.exe /Fo:artifacts\ && artifacts\hvm_unit_tests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw 'HVM control-arithmetic unit tests failed.'
          }

      - name: Run captured navigation identity regressions
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) { throw 'Could not locate the x64 MSVC toolset.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          # 只编译生产身份判断和进程句柄 mocks，不附加真实调试目标。
          cmd /c "`"$vcvars`" >nul && python -B tools\test_x64dbg_navigation_identity.py --compiler cl --output artifacts\navigation_identity_tests.exe --negative-controls"
          if ($LASTEXITCODE -ne 0) { throw 'Captured navigation identity regressions failed.' }

      - name: Run pointer-chain core, binding and Win32 identity tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) { throw 'Could not locate the x64 MSVC toolset.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          # Win32 tests inspect only their own executable and use scripted reads.
          foreach ($runner in @('Invoke-PointerChainTests.ps1', 'Invoke-PointerChainBindingTests.ps1', 'Invoke-PointerChainWorkbenchAccessTests.ps1')) {
            cmd /c "`"$vcvars`" >nul && pwsh -NoProfile -File tools\$runner -CppCompiler cl"
            if ($LASTEXITCODE -ne 0) { throw "Pointer-chain tests failed: $runner" }
          }

      - name: Run page-reader regressions against Windows memory
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) { throw 'Could not locate the x64 MSVC toolset.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          # Tests use only their own allocated pages and never load a driver.
          cmd /c "`"$vcvars`" >nul && pwsh -NoProfile -File tools\Invoke-MemoryPageReaderWin32Tests.ps1 -CppCompiler cl"
          if ($LASTEXITCODE -ne 0) { throw 'Page-reader scripted and native Windows regressions failed.' }

      - name: Run offline pool allocation analysis regressions
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) { throw 'Could not locate the x64 MSVC toolset.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          # Decode synthetic EVENT_RECORDs and pair offline allocations only.
          # A UUID-named private provider supplies a synthetic ETL. No system
          # logger, driver or actual system Pool capture is started.
          cmd /c "`"$vcvars`" >nul && pwsh -NoProfile -File tools\Invoke-PoolAllocationAnalysisTests.ps1 -CppCompiler cl"
          if ($LASTEXITCODE -ne 0) { throw 'Offline pool allocation analysis regressions failed.' }

      # --fail-on-risk is the point of this step.  Without it the auditor ran,
      # wrote a report nobody opened, and the HIGH findings it recorded sat
      # untouched for over a month - which is exactly how a confirmed local
      # privilege escalation stayed in the tree.  A check that cannot fail the
      # build is documentation, not a gate.
      - name: Audit IOCTL registry and access policy
        run: >-
          python tools/ioctl_audit/ksword_ioctl_audit.py
          --repo-root .
          --format markdown
          --out artifacts/ioctl-audit.md
          --fail-on-risk

      - name: Upload IOCTL audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ioctl-audit
          path: artifacts/ioctl-audit.md
          if-no-files-found: warn

  usermode-release:
    name: User-mode Release build
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.usermode == 'true' && needs.source-integrity.result == 'success'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true

      - name: Install Qt MSBuild files
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'qt-msbuild.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'qt-msbuild'
          Invoke-WebRequest `
            -Uri 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip' `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force
          $targets = Get-ChildItem -Path $destination -Filter qt.targets -Recurse -File |
            Select-Object -First 1
          if ($null -eq $targets) {
            throw 'Qt MSBuild archive did not contain qt.targets.'
          }
          "KSWORD_QT_MSBUILD=$($targets.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Build supported user-mode Release targets
        shell: pwsh
        run: |
          $env:KSWORD_QT_DIR = $env:QT_ROOT_DIR
          $env:QTDIR = $env:QT_ROOT_DIR
          if (-not (Test-Path (Join-Path $env:KSWORD_QT_MSBUILD 'qt.targets'))) {
            throw "Qt MSBuild path is invalid: $env:KSWORD_QT_MSBUILD"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate 64-bit MSBuild through vswhere.'
          }

          # The release DynData pack is intentionally generated from the private,
          # reviewed PDB corpus and is not tracked in this source repository. The
          # The Launcher project consumes the v4 pack to generate its compile-time
          # support manifest. Keep empty CI-only v3/v4 fixtures because the real
          # packs come from the private, reviewed PDB corpus. They are never
          # copied to a release artifact or published.
          $ciProfiles = 'Ksword5.1/Ksword5.1/profiles'
          New-Item -ItemType Directory -Path $ciProfiles -Force | Out-Null
          @'
          {
            "packVersion": 3,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v3.json') -Encoding utf8
          @'
          {
            "schemaVersion": 1,
            "packVersion": 4,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v4.json') -Encoding utf8

          $properties = @(
            '/t:Build',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            '/p:PreferredToolArchitecture=x64',
            '/p:PROCESSOR_ARCHITECTURE=AMD64',
            '/p:PROCESSOR_ARCHITEW6432=AMD64',
            "/p:QtMsBuild=$env:KSWORD_QT_MSBUILD",
            '/p:KswordArkSkipAutoTestSign=true',
            # 空包只供 Launcher 编译；运行时规范化必须使用私有正式语料，CI 不发布占位档案。
            '/p:KswordSkipDynDataProfilePack=true',
            '/m:1',
            '/v:minimal'
          )
          $projects = @(
            'Ksword5.1/Ksword5.1/Ksword5.1.vcxproj',
            'Launcher/Launcher.vcxproj',
            'Taskbar/Taskbar.vcxproj',
            'KswordHUD/KswordHUD.vcxproj',
            'APIMonitor_x64/APIMonitor_x64.vcxproj',
            'KswordCLI/KswordCLI.vcxproj',
            'KswordFsDecodeTests/KswordFsDecodeTests.vcxproj',
            'DwmZOrderAgent/tests/OrderTests.vcxproj'
          )
          foreach ($project in $projects) {
            & $msbuild $project @properties
            if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed for $project with exit code $LASTEXITCODE."
            }
          }

          # 文件系统结构解码的离线单元测试：只喂字节数组，不打开卷、不加载驱动。
          # runlist 是磁盘上的不可信输入，越界与溢出分支在真实卷上极难构造。
          $decodeTests = 'KswordFsDecodeTests/x64/Release/KswordFsDecodeTests.exe'
          if (-not (Test-Path $decodeTests)) {
            throw "File-system decode tests were not built: $decodeTests"
          }
          & $decodeTests
          if ($LASTEXITCODE -ne 0) {
            throw "File-system decode tests failed with exit code $LASTEXITCODE."
          }

          # Loads the agent only in the test process; never injects into CI's DWM.
          & 'DwmZOrderAgent/tests/x64/Release/DwmZOrderTests.exe' `
            (Join-Path $PWD 'Ksword5.1/x64/Release/KswordDwmZOrder.dll')
          if ($LASTEXITCODE -ne 0) {
            throw "DWM order model/agent protocol tests failed with exit code $LASTEXITCODE."
          }

          # Exercise the actual marketplace parser/promotion functions for both
          # ZIP layouts; invalid manifests must preserve the installed plugin.
          python 'tools/test_plugin_install_layout.py' --msbuild $msbuild --qt-dir $env:KSWORD_QT_DIR
          if ($LASTEXITCODE -ne 0) {
            throw "Plugin installation layout regression failed with exit code $LASTEXITCODE."
          }

      - name: Verify primary build artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'Ksword5.1/x64/Release/Ksword5.1.exe',
            'Ksword5.1/x64/Release/Launcher.exe',
            'Ksword5.1/x64/Release/Taskbar.exe',
            'Ksword5.1/x64/Release/KswordHUD.exe',
            'Ksword5.1/x64/Release/APIMonitor_x64.dll',
            'Ksword5.1/x64/Release/KswordDwmZOrder.dll',
            'Ksword5.1/x64/Release/qtadvanceddocking.dll',
            'Ksword5.1/x64/Release/KswordCLI.exe'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected Release artifact(s) missing: $($missing -join ', ')"
          }

      - name: Verify QADS runtime matches the checked-out library
        run: python tools/verify_qads_runtime.py Ksword5.1/x64/Release

      - name: Upload user-mode artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordUserMode-unsigned-Release
          path: |
            Ksword5.1/x64/Release/**
            !Ksword5.1/x64/Release/profiles/ark_dyndata_pack_v4.json.qz
            !Ksword5.1/x64/Release/profiles/launcher_support_manifest.json
          if-no-files-found: error

  ksword-setup:
    name: KswordSetup Release build
    needs: changes
    if: needs.changes.outputs.setup == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt for payload prerequisite
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true

      - name: Install Qt MSBuild files
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'qt-msbuild.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'qt-msbuild'
          Invoke-WebRequest `
            -Uri 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip' `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force
          $targets = Get-ChildItem -Path $destination -Filter qt.targets -Recurse -File |
            Select-Object -First 1
          if ($null -eq $targets) {
            throw 'Qt MSBuild archive did not contain qt.targets.'
          }
          "KSWORD_QT_MSBUILD=$($targets.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Build payload prerequisite and installer
        shell: pwsh
        run: |
          $env:KSWORD_QT_DIR = $env:QT_ROOT_DIR
          $env:QTDIR = $env:QT_ROOT_DIR
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate 64-bit MSBuild through vswhere.'
          }

          # KswordSetup embeds the Release payload generated by the main project.
          # The private profile corpus is not tracked, so provide the same
          # compile-only v3/v4 fixtures used by the regular user-mode CI.
          $ciProfiles = 'Ksword5.1/Ksword5.1/profiles'
          New-Item -ItemType Directory -Path $ciProfiles -Force | Out-Null
          @'
          {
            "packVersion": 3,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v3.json') -Encoding utf8
          @'
          {
            "schemaVersion": 1,
            "packVersion": 4,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v4.json') -Encoding utf8

          $properties = @(
            '/t:Build',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            '/p:PreferredToolArchitecture=x64',
            '/p:PROCESSOR_ARCHITECTURE=AMD64',
            '/p:PROCESSOR_ARCHITEW6432=AMD64',
            "/p:SolutionDir=$((Resolve-Path 'Ksword5.1').Path)\",
            "/p:QtMsBuild=$env:KSWORD_QT_MSBUILD",
            '/p:KswordArkSkipAutoTestSign=true',
            # 与普通 user-mode job 一致：不将空的编译占位包作为运行时档案打包。
            '/p:KswordSkipDynDataProfilePack=true',
            '/m:1',
            '/v:minimal'
          )
          & $msbuild 'Ksword5.1/Ksword5.1/Ksword5.1.vcxproj' @properties
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for Ksword5.1 payload prerequisite with exit code $LASTEXITCODE."
          }

          # Verify before embedding so Setup cannot ship an older QADS runtime.
          python tools/verify_qads_runtime.py Ksword5.1/x64/Release
          if ($LASTEXITCODE -ne 0) {
            throw 'QADS runtime validation failed for the installer payload.'
          }

          # Never embed compile-only empty DynData fixtures in an artifact that
          # can be promoted to a public automatic prerelease.
          $ciOnlyProfileOutputs = @(
            'Ksword5.1/x64/Release/profiles/ark_dyndata_pack_v4.json.qz',
            'Ksword5.1/x64/Release/profiles/launcher_support_manifest.json'
          )
          foreach ($profileOutput in $ciOnlyProfileOutputs) {
            if (Test-Path -LiteralPath $profileOutput) {
              Remove-Item -LiteralPath $profileOutput -Force
            }
          }

          & $msbuild 'KswordSetup/KswordSetup.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PreferredToolArchitecture=x64 `
            /p:PROCESSOR_ARCHITECTURE=AMD64 `
            /p:PROCESSOR_ARCHITEW6432=AMD64 `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordSetup with exit code $LASTEXITCODE."
          }

      - name: Verify KswordSetup artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'Ksword5.1/x64/Release/KswordSetup.exe',
            'Ksword5.1/x64/Release/KswordSetup.pdb'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordSetup artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordSetup artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordSetup-unsigned-Release
          path: |
            Ksword5.1/x64/Release/KswordSetup.exe
            Ksword5.1/x64/Release/KswordSetup.pdb
          if-no-files-found: error

  ksword-arklight:
    name: KswordARKLight Release build
    needs: changes
    if: needs.changes.outputs.arklight == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build driver prerequisite and KswordARKLight
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate 64-bit MSBuild through vswhere.'
          }

          $solutionDir = (Resolve-Path 'Ksword5.1').Path + '\'
          & $msbuild 'KswordARKDriver/KswordARKDriver.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PreferredToolArchitecture=x64 `
            /p:PROCESSOR_ARCHITECTURE=AMD64 `
            /p:PROCESSOR_ARCHITEW6432=AMD64 `
            "/p:SolutionDir=$solutionDir" `
            /p:KswordArkSkipAutoVariantSign=true `
            /p:KswordArkSkipAutoTestSign=true `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordARKDriver prerequisite with exit code $LASTEXITCODE."
          }

          & $msbuild 'KswordARKLight/KswordARKLight.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PreferredToolArchitecture=x64 `
            /p:PROCESSOR_ARCHITECTURE=AMD64 `
            /p:PROCESSOR_ARCHITEW6432=AMD64 `
            /p:KswordArkLightEnsureDriverBuilt=false `
            /p:KswordArkLightSkipDriverSign=true `
            /p:KswordArkLightReuseSignedDriver=true `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordARKLight with exit code $LASTEXITCODE."
          }

          & $msbuild 'KswordARKLightTests/KswordARKLightTests.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PreferredToolArchitecture=x64 `
            /p:PROCESSOR_ARCHITECTURE=AMD64 `
            /p:PROCESSOR_ARCHITEW6432=AMD64 `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordARKLightTests with exit code $LASTEXITCODE."
          }

          # 退出码抓不到「整个套件没被链接进来」：那种情况下测试进程照样
          # 退出 0、照样打印「全部通过」，而那些断言一条都没跑过。所以这里
          # 同时按 scripts/ksword-expected-suites.json 核对套件是否齐全、
          # 断言数有没有缩水；脚本自己会执行测试并把两条判据合起来判。
          & 'scripts/Test-KswordSuiteManifest.ps1' `
            -TestExePath 'KswordARKLightTests/x64/Release/KswordARKLightTests.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "KswordARKLightTests failed or a listed suite was absent (exit code $LASTEXITCODE)."
          }

      - name: Verify KswordARKLight artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'Ksword5.1/x64/Release/KswordARKLight.exe',
            'KswordARKLight/generated/KswordARK.sys'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordARKLight artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordARKLight artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordARKLight-unsigned-Release
          path: |
            Ksword5.1/x64/Release/KswordARKLight.exe
            KswordARKLight/generated/KswordARK.sys
          if-no-files-found: error

  ksword-ce-plugin:
